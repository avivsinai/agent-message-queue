name: ci

on:
  push:
    branches: ["main"]
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Check PR title
        if: github.event_name == 'pull_request'
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: python3 scripts/check_pr_title.py "$PR_TITLE"
      - name: Check commit overrides
        if: github.event_name == 'pull_request'
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: python3 scripts/check_commit_overrides.py
      - name: Check wake test changes
        if: github.event_name == 'pull_request'
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: python3 scripts/check_wake_test_changes.py
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Check skills sync
        run: make check-skills
      - name: Check CLI docs freshness
        run: make check-docs-cli
      - name: Check board page script
        run: make check-board-page
      - name: Format check
        run: make fmt-check
      - name: Vet
        run: go vet ./...
      - name: Cross-platform build
        run: |
          GOOS=windows GOARCH=amd64 go vet ./...
          GOOS=windows go build ./...
          GOOS=freebsd go build ./...
          # A syscall.Mkfifo in a test file compiles under vet but not as a
          # Windows test binary; fail fast here instead of in the windows leg.
          GOOS=windows go test -c ./internal/cli -o /dev/null
      - name: Govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...
      - name: Test
        run: go test ./...
      - name: Race tests (activity)
        # TestR2NativeEnqueueAndConsumer is a data-race regression: it can
        # only fail under -race.
        run: go test -race -count=1 ./internal/remote/activity/
      - name: Hook script and wake process tests (serial)
        # Real SessionStart bash script and fake amq wake child processes;
        # wall-clock sensitive, so they run alone with -p 1 instead of inside
        # the parallel suite above.
        run: |
          AMQ_HOOK_SCRIPT_TESTS=1 go test -p 1 -count=1 ./internal/keepalive/hookinstall/
          AMQ_WAKE_PROCESS_TESTS=1 go test -p 1 -count=1 -run '^(TestStartWakeWaitsForReadyFileAndPassesTarget|TestStartWakeDoesNotInheritCoopOwnerToken|TestStartWakeRefreshesOnlyConclusivelyDifferentLiveImages|TestStartWakeFailsWhenProcessExitsBeforeReady|TestStartWakePreservesAlreadyTextWithoutRelabelingFailure|TestStartWakeCancelAfterReadyDoesNotKillEstablishedWake|TestStartWakeTimesOutWhenReadyFileNeverAppears|TestStartWakeDrainSurvivesLauncherProcessExit|TestRetireWakeEmitsExactArgvAndParsesRetired)$' ./internal/keepalive/amq/
      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - name: pi extension test
        run: npm test
      - name: amq-board Claude Code plugin test
        # claude plugin test needs no login; the version is the one whose
        # plugin API the module and its tests are written against or later.
        env:
          DISABLE_AUTOUPDATER: "1"
          CLAUDE_CODE_DISABLE_NONESSENTIAL_TRAFFIC: "1"
        run: |
          npm install --global --no-fund --no-audit @anthropic-ai/claude-code@2.1.310
          claude plugin validate plugins/amq-board
          claude plugin test plugins/amq-board
      - name: Smoke test
        run: make smoke
      - name: Module, contract, and hook checks
        run: make mod-tidy-check contract-check hook-env-check
      - name: Lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.13.1

  # Native Windows leg for the exclusive drain-claim contract (issue #485).
  # Cross-compilation cannot exercise the bug: os.Root.Rename on Windows is
  # handle-based and lets every concurrent claimer succeed. Scope stays
  # focused on the claim path; the broader suite has known unrelated Windows
  # failures tracked separately.
  windows-claim-test:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      # Focused regex, not the full fsq suite. read/monitor/DLQ capture all
      # claim through the same MoveNewToCur primitive proven here.
      - name: Claim primitive and maildir contracts
        run: go test ./internal/fsq -run '^TestMoveNewToCur|^TestClaimRename|^TestClaimCollision|^TestClaimPinnedRoot|^TestWindowsNoReplace|^TestSyncDirPlatform' -count=1
      - name: Concurrent drain single-winner gate
        run: go test ./internal/cli -run '^TestDrainInboxItemsConcurrentClaimsSingleWinner$' -count=50
      - name: Drain claim path
        run: go test ./internal/cli -run '^TestDrainInboxItems' -count=1
      - name: File lock serializes holders
        run: go test ./internal/lock -count=1
      - name: Windows launch API compatibility
        run: go test ./launchapi -run '^TestWindowsCompatibilityAdvertisesOnlyCallableLaunchSurface$' -count=1
      - name: Native Windows Codex and Claude adapters
        run: go test ./internal/keepalive/adapter -run '^(TestWindows|TestClaudePrint|TestCodexQueue)' -count=1

  # Darwin test leg. Linux + a windows claim job run elsewhere; this gates the
  # defect class where a test passes on Linux but fails on macOS (e.g. macOS
  # resolves /var -> /private/var). Live/PTY/cmux/ghostty paths are env-gated
  # (AMQ_*_LIVE) and skip by default, so plain `go test ./...` is sufficient.
  macos-test:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history: a wake upgrade test shells out to `git cat-file`.
          fetch-depth: 0
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Test
        run: go test ./...
      - name: Hook script and wake process tests (serial)
        # Real SessionStart bash script and fake amq wake child processes;
        # wall-clock sensitive, so they run alone with -p 1 instead of inside
        # the parallel suite above.
        run: |
          AMQ_HOOK_SCRIPT_TESTS=1 go test -p 1 -count=1 ./internal/keepalive/hookinstall/
          AMQ_WAKE_PROCESS_TESTS=1 go test -p 1 -count=1 -run '^(TestStartWakeWaitsForReadyFileAndPassesTarget|TestStartWakeDoesNotInheritCoopOwnerToken|TestStartWakeRefreshesOnlyConclusivelyDifferentLiveImages|TestStartWakeFailsWhenProcessExitsBeforeReady|TestStartWakePreservesAlreadyTextWithoutRelabelingFailure|TestStartWakeCancelAfterReadyDoesNotKillEstablishedWake|TestStartWakeTimesOutWhenReadyFileNeverAppears|TestStartWakeDrainSurvivesLauncherProcessExit|TestRetireWakeEmitsExactArgvAndParsesRetired)$' ./internal/keepalive/amq/
