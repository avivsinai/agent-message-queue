name: Release

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to (re)release (e.g. v0.28.5)"
        required: true
        type: string
      skip-skill-publish:
        description: "Skip skill publishing after release"
        required: false
        type: boolean
        default: true
      goreleaser-config-from-workflow-ref:
        description: "Build the tag's source with .goreleaser.yaml from the dispatched ref (a tag whose packaging config failed)"
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: release-${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag || github.sha }}
  cancel-in-progress: false

jobs:
  prepare:
    if: >-
      ${{
        github.event_name == 'workflow_dispatch' ||
        startsWith(github.event.head_commit.message, 'chore(release): v') ||
        startsWith(github.event.head_commit.message, 'Merge pull request')
      }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      tag: ${{ steps.prepare.outputs.tag }}
      version: ${{ steps.prepare.outputs.version }}
      release_ref: ${{ steps.prepare.outputs.release_ref }}
      release_sha: ${{ steps.prepare.outputs.release_sha }}
      prerelease: ${{ steps.prepare.outputs.prerelease }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Resolve release metadata
        id: prepare
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_TAG: ${{ github.event.inputs.tag }}
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
          GITHUB_SHA: ${{ github.sha }}
        shell: bash
        run: ./scripts/resolve-release-metadata.sh

  verify:
    needs: prepare
    if: needs.prepare.result == 'success' && needs.prepare.outputs.tag != ''
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ needs.prepare.outputs.release_ref }}
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Verify release metadata
        run: ./scripts/check-release-version.sh "${{ needs.prepare.outputs.version }}"
      - name: Run tests
        run: make test
      - name: Run smoke tests
        run: make smoke
      - name: Build CLI
        run: VERSION=${{ needs.prepare.outputs.tag }} make build
      - name: Check embedded version
        run: |
          ./amq version | grep -Fx "${{ needs.prepare.outputs.version }}"
          ./amq-keepalive --version | grep -Fx "${{ needs.prepare.outputs.version }}"

  release:
    needs: [prepare, verify]
    if: needs.prepare.result == 'success' && needs.prepare.outputs.tag != '' && needs.verify.result == 'success'
    runs-on: macos-latest
    # Each darwin binary is notarized in its build hook (up to 20 minutes per
    # submission), and GoReleaser runs only a few hooks at a time.
    timeout-minutes: 90
    permissions:
      contents: write
      pull-requests: write
      attestations: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ needs.prepare.outputs.release_ref }}
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Create release tag after verification
        shell: bash
        env:
          TAG: ${{ needs.prepare.outputs.tag }}
          RELEASE_SHA: ${{ needs.prepare.outputs.release_sha }}
        run: |
          set -euo pipefail

          tag_commit_sha() {
            git rev-parse "refs/tags/${1}^{commit}" 2>/dev/null || git rev-parse "refs/tags/${1}"
          }

          git fetch --force --tags origin
          if git rev-parse -q --verify "refs/tags/${TAG}" >/dev/null 2>&1; then
            existing_sha="$(tag_commit_sha "$TAG")"
            if [[ "$existing_sha" != "$RELEASE_SHA" ]]; then
              echo "::error::Tag ${TAG} already exists but points to ${existing_sha}, not ${RELEASE_SHA}."
              exit 1
            fi
          else
            git tag "$TAG" "$RELEASE_SHA"
            git push origin "refs/tags/${TAG}"
          fi
      - name: Extract release notes for this tag
        shell: bash
        env:
          RELEASE_NOTES_PATH: ${{ runner.temp }}/RELEASE_NOTES.md
        run: |
          VERSION="${{ needs.prepare.outputs.version }}"
          # Keep this self-contained: workflow_dispatch may check out an older
          # tag that predates scripts/release_changelog_section.py.
          python3 - "$VERSION" "$RELEASE_NOTES_PATH" <<'PY'
          import pathlib
          import re
          import sys

          version = sys.argv[1]
          output_path = pathlib.Path(sys.argv[2])
          text = pathlib.Path("CHANGELOG.md").read_text(encoding="utf-8")
          date = r"\d{4}-\d{2}-\d{2}"
          heading = re.compile(
              rf"(?m)^## \[{re.escape(version)}\](?:\([^\n)]+\))? "
              rf"(?:\({date}\)|- {date})$"
          )
          match = heading.search(text)
          if not match:
              raise SystemExit(f"missing changelog section for {version}")
          next_heading = re.search(r"(?m)^## \[", text[match.end():])
          end = match.end() + next_heading.start() if next_heading else len(text)
          output_path.write_text(
              text[match.start():end].strip() + "\n", encoding="utf-8"
          )
          PY
      # A tag's source is immutable once published to the Go module proxy, so a
      # tag whose packaging config failed is re-released from the same source
      # with the corrected .goreleaser.yaml of the dispatched ref. Opt-in only;
      # the v0.81.0 archive failure is the case it exists for.
      - name: Select GoReleaser config
        id: goreleaser_config
        shell: bash
        env:
          FROM_WORKFLOW_REF: ${{ github.event_name == 'workflow_dispatch' && inputs.goreleaser-config-from-workflow-ref == true }}
        run: |
          set -euo pipefail
          if [[ "$FROM_WORKFLOW_REF" != "true" ]]; then
            echo "args=" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git fetch --no-tags --depth=1 origin "$GITHUB_SHA"
          git show "$GITHUB_SHA:.goreleaser.yaml" > "$RUNNER_TEMP/goreleaser.yaml"
          # The tag may predate the signing script its build hooks call. Keep
          # the copy outside the checkout: GoReleaser refuses a dirty tree.
          git show "$GITHUB_SHA:scripts/codesign-macos.sh" > "$RUNNER_TEMP/codesign-macos.sh"
          chmod 755 "$RUNNER_TEMP/codesign-macos.sh"
          echo "AMQ_CODESIGN_SCRIPT=$RUNNER_TEMP/codesign-macos.sh" >> "$GITHUB_ENV"
          echo "args=--config $RUNNER_TEMP/goreleaser.yaml" >> "$GITHUB_OUTPUT"
          echo "::notice::Building ${{ needs.prepare.outputs.tag }} source with .goreleaser.yaml from ${GITHUB_SHA}."
      - name: Configure macOS signing
        shell: bash
        env:
          P12_BASE64: ${{ secrets.APPLE_DEVELOPER_ID_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.APPLE_DEVELOPER_ID_P12_PASSWORD }}
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.APPLE_NOTARY_ISSUER_ID }}
          NOTARY_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
          NOTARY_KEY_P8_BASE64: ${{ secrets.APPLE_NOTARY_KEY_P8_BASE64 }}
        run: |
          set -euo pipefail
          names=(P12_BASE64 P12_PASSWORD TEAM_ID NOTARY_ISSUER_ID NOTARY_KEY_ID NOTARY_KEY_P8_BASE64)
          present=0
          for name in "${names[@]}"; do
            [[ -n "${!name}" ]] && present=$((present + 1))
          done
          if (( present == 0 )); then
            echo "::warning::macOS binaries are signed ad-hoc: the APPLE_* signing secrets are not configured, so users grant macOS permissions again after each upgrade."
            exit 0
          fi
          if (( present != ${#names[@]} )); then
            echo "::error::Set all APPLE_* signing secrets or none (see CLAUDE.md Release Contract)."
            exit 1
          fi

          keychain="$RUNNER_TEMP/amq-signing.keychain-db"
          keychain_password="$(openssl rand -hex 24)"
          security create-keychain -p "$keychain_password" "$keychain"
          # Publish the path first so the cleanup step removes the keychain
          # even when a later command here fails.
          echo "AMQ_MACOS_KEYCHAIN=$keychain" >>"$GITHUB_ENV"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          printf '%s' "$P12_BASE64" | base64 --decode >"$RUNNER_TEMP/developer-id.p12"
          security import "$RUNNER_TEMP/developer-id.p12" -k "$keychain" -P "$P12_PASSWORD" -T /usr/bin/codesign
          rm -f "$RUNNER_TEMP/developer-id.p12"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$keychain_password" "$keychain" >/dev/null
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')

          # The SHA-1 picks one identity even if the .p12 holds a renewed and
          # an older certificate. -v lists only identities with a trusted
          # chain, so the .p12 must include the Developer ID intermediate.
          identity_sha="$(security find-identity -v -p codesigning "$keychain" \
            | awk -v team="($TEAM_ID)" '/Developer ID Application: / && index($0, team) { print $2; exit }')"
          if [[ -z "$identity_sha" ]]; then
            echo "::error::APPLE_DEVELOPER_ID_P12_BASE64 has no trusted 'Developer ID Application' identity for APPLE_TEAM_ID."
            exit 1
          fi

          printf '%s' "$NOTARY_KEY_P8_BASE64" | base64 --decode >"$RUNNER_TEMP/notary-key.p8"
          {
            echo "AMQ_MACOS_SIGN_IDENTITY=$identity_sha"
            echo "AMQ_NOTARY_KEY_PATH=$RUNNER_TEMP/notary-key.p8"
          } >>"$GITHUB_ENV"

      - name: Release
        id: publish_release
        uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          distribution: goreleaser
          version: '~> v2'
          args: release --clean ${{ steps.goreleaser_config.outputs.args }} --release-notes ${{ runner.temp }}/RELEASE_NOTES.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HOMEBREW_TAP_GITHUB_TOKEN: ${{ secrets.HOMEBREW_TAP_GITHUB_TOKEN }}
          AMQ_MACOS_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          AMQ_NOTARY_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
          AMQ_NOTARY_ISSUER_ID: ${{ secrets.APPLE_NOTARY_ISSUER_ID }}

      - name: Remove macOS signing material
        if: always()
        shell: bash
        run: |
          if [[ -n "${AMQ_MACOS_KEYCHAIN:-}" ]]; then
            security delete-keychain "$AMQ_MACOS_KEYCHAIN" || true
          fi
          rm -f "$RUNNER_TEMP/developer-id.p12" "$RUNNER_TEMP/notary-key.p8"

      - name: Collect attestation subjects
        id: attestation_subjects
        shell: bash
        run: |
          set -euo pipefail
          subjects="$(find dist -maxdepth 1 -type f | sort)"
          if [[ -z "$subjects" ]]; then
            echo "::error::No release artifacts found to attest."
            exit 1
          fi
          {
            echo "subjects<<EOF"
            printf '%s\n' "$subjects"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Generate artifact attestation
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: ${{ steps.attestation_subjects.outputs.subjects }}

      - name: Mark release pull request as tagged
        if: always() && steps.publish_release.outcome == 'success'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ needs.prepare.outputs.release_sha }}
          VERSION: ${{ needs.prepare.outputs.version }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail

          pull_pages="$(
            gh api --paginate --slurp \
              --header "Accept: application/vnd.github+json" \
              "repos/${GITHUB_REPOSITORY}/commits/${RELEASE_SHA}/pulls?per_page=100"
          )"
          pull_state="$(
            jq -e --arg version "$VERSION" --arg release_sha "$RELEASE_SHA" '
              if type == "array" and all(.[]; type == "array") and
                  all(.[][]; type == "object")
              then
                [.[][]] as $associated |
                [
                  $associated[] |
                  .number as $number |
                  select(
                    .merged_at != null and
                    .base.ref == "main" and
                    .title == ("chore(release): v" + $version) and
                    .merge_commit_sha == $release_sha and
                    ($number | type == "number" and . > 0 and floor == .)
                  ) |
                  $number
                ] as $exact |
                {associated_count: ($associated | length), exact: $exact}
              else error("malformed commit pulls response")
              end
            ' <<<"$pull_pages"
          )"
          associated_count="$(jq -er '.associated_count' <<<"$pull_state")"
          release_pr_count="$(jq -er '.exact | length' <<<"$pull_state")"

          if [[ "$associated_count" == "0" && "$EVENT_NAME" == "workflow_dispatch" ]]; then
            echo "Historical dispatch has no associated release PR; label reconciliation is not applicable."
            exit 0
          fi
          if [[ "$associated_count" != "1" || "$release_pr_count" != "1" ]]; then
            echo "::error::Expected one unambiguous merged release PR for v${VERSION} at ${RELEASE_SHA}; found ${associated_count} associated and ${release_pr_count} exact."
            exit 1
          fi
          release_pr="$(jq -er '.exact[0] | select(type == "number" and . > 0 and floor == .)' <<<"$pull_state")"

          read_labels() {
            local response
            if ! response="$(
              gh api \
                --header "Accept: application/vnd.github+json" \
                "repos/${GITHUB_REPOSITORY}/issues/${release_pr}"
            )"; then
              return 1
            fi
            jq -e '
              if type == "object" and (.labels | type == "array") and
                  all(.labels[]; type == "object" and (.name | type == "string"))
              then [.labels[].name]
              else error("malformed labels response")
              end
            ' <<<"$response"
          }

          labels="$(read_labels)"
          jq -e '
            ([.[] | select(. == "autorelease: tagged")] | length) <= 1 and
            ([.[] | select(. == "autorelease: pending")] | length) <= 1
          ' >/dev/null <<<"$labels" || {
            echo "::error::Release PR has duplicate lifecycle labels."
            exit 1
          }
          if ! jq -e 'index("autorelease: tagged") != null' >/dev/null <<<"$labels"; then
            if ! printf '%s\n' '{"labels":["autorelease: tagged"]}' |
              gh api \
                --method POST \
                --header "Accept: application/vnd.github+json" \
                --input - \
                "repos/${GITHUB_REPOSITORY}/issues/${release_pr}/labels" \
                >/dev/null; then
              echo "::warning::Tagged label mutation returned nonzero; checking authoritative state."
            fi
            labels="$(read_labels)"
            jq -e '
              ([.[] | select(. == "autorelease: tagged")] | length) == 1 and
              ([.[] | select(. == "autorelease: pending")] | length) <= 1
            ' >/dev/null <<<"$labels" || {
              echo "::error::Tagged label was not confirmed; pending label remains untouched."
              exit 1
            }
          fi

          if jq -e 'index("autorelease: pending") != null' >/dev/null <<<"$labels"; then
            if ! gh api \
              --method DELETE \
              --header "Accept: application/vnd.github+json" \
              "repos/${GITHUB_REPOSITORY}/issues/${release_pr}/labels/autorelease%3A%20pending" \
              >/dev/null; then
              echo "::warning::Pending label mutation returned nonzero; checking authoritative state."
            fi
          else
            echo "Release PR #${release_pr} is already tagged."
          fi

          labels="$(read_labels)"
          jq -e '
            ([.[] | select(. == "autorelease: tagged")] | length) == 1 and
            ([.[] | select(. == "autorelease: pending")] | length) == 0
          ' >/dev/null <<<"$labels" || {
            echo "::error::Release PR lifecycle labels did not converge."
            exit 1
          }

  skill-publish:
    needs: [prepare, release]
    if: >-
      needs.prepare.outputs.tag != '' &&
      needs.release.result == 'success' &&
      (github.event_name == 'push' || inputs.skip-skill-publish != true)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ needs.prepare.outputs.tag }}

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'

      - name: Install skild
        run: npm install -g skild

      - name: Configure skild auth
        env:
          SKILD_AUTH_JSON: ${{ secrets.SKILD_AUTH_JSON }}
        run: |
          umask 077
          mkdir -p ~/.skild
          printf '%s' "$SKILD_AUTH_JSON" > ~/.skild/registry-auth.json

      - name: Verify release metadata
        run: ./scripts/check-release-version.sh "${{ needs.prepare.outputs.version }}"

      - name: Publish skills
        env:
          TAG_VERSION: ${{ needs.prepare.outputs.version }}
        run: ./scripts/publish-skild-skills.sh "$TAG_VERSION"
